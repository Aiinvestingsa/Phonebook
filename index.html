<html lang="en">
<head>

<title>VUNO ROYAL MOVIES 3 - Admin Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#080808;color:#fff;padding-bottom:80px}
header{background:#000;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;flex-wrap:wrap;gap:10px}
.logo{font-size:22px;font-weight:900;color:#E50914}.logo span{color:#FFD700}
.searchBox{flex:1;max-width:400px;display:flex;gap:5px}.searchBox input{flex:1;padding:10px;border-radius:20px;border:none;outline:none}
.btn{background:#E50914;color:#fff;padding:10px 16px;border:none;border-radius:20px;font-weight:bold;cursor:pointer;font-size:13px}
.btn-gold{background:#FFD700;color:#000}.btn-dark{background:#222;color:#fff;border:1px solid #444}
.hero{height:340px;background:linear-gradient(to top,#080808,transparent),url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1200') center/cover;display:flex;align-items:end;padding:25px}
.hero h1{font-size:34px;line-height:1.1}.hero p{color:#ddd;margin:10px 0}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 15px;background:#080808;position:sticky;top:58px;z-index:10}
.cats button{padding:8px 16px;border-radius:20px;border:1px solid #333;background:#1a1a1a;color:#fff;white-space:nowrap;cursor:pointer}
.cats button.active{background:#E50914}
.row{padding:10px 20px}.row h2{margin:10px 0 12px;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:#1a1a1a;border-radius:12px;overflow:hidden;position:relative;cursor:pointer}
.card img{width:100%;height:230px;object-fit:cover;display:block}
.card div{padding:10px}.card h3{font-size:13px;height:32px;overflow:hidden}.card p{font-size:11px;color:#aaa}
.heart{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;z-index:2}
.heart.active{color:#E50914}
.badge{display:inline-block;background:#FFD700;color:#000;font-size:10px;font-weight:bold;padding:2px 6px;border-radius:4px;margin-top:5px}
.progress{height:4px;background:#333}.progress div{height:100%;background:#E50914;width:0%}
#player{position:fixed;inset:0;background:rgba(0,0,0,.97);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:15px}
#player iframe{width:95%;max-width:900px;height:480px;border:none;border-radius:10px;background:#000}
#close{position:absolute;top:15px;right:20px;font-size:28px;cursor:pointer}
.actionRow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:200;padding:15px;overflow-y:auto}
.modalBox{background:#1a1a1a;padding:22px;border-radius:15px;width:100%;max-width:420px}
.modalBox input,.modalBox select,.modalBox textarea{width:100%;padding:11px;margin:7px 0;border-radius:8px;border:none;outline:none;background:#fff;color:#000}
.modalBox h2{margin-bottom:8px}.small{font-size:12px;color:#aaa}
