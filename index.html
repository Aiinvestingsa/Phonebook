<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vuno Royal Movies - Watch Free Movies</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#0a0a0a;color:#fff}
  header{background:#000;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
  .logo{font-size:24px;font-weight:900;color:#E50914}
  .logo span{color:#FFD700}
  input{padding:10px;width:300px;border-radius:20px;border:none;outline:none}
  .hero{height:350px;background:linear-gradient(to top,#0a0a0a,transparent),url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1200') center/cover;display:flex;align-items:end;padding:30px}
  .hero h1{font-size:42px}
  .hero p{color:#ccc;margin:10px 0}
  .btn{background:#E50914;color:#fff;padding:12px 25px;border:none;border-radius:5px;font-weight:bold;cursor:pointer}
  .row{padding:20px}
  .row h2{margin-bottom:15px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px}
  .card{background:#1a1a1a;border-radius:10px;overflow:hidden;cursor:pointer;transition:.3s}
  .card:hover{transform:scale(1.05)}
  .card img{width:100%;height:250px;object-fit:cover}
  .card div{padding:10px}
  .card h3{font-size:14px}
  .card p{font-size:12px;color:#aaa}
  /* Player */
  #player{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:20px}
  #player iframe{width:90%;max-width:900px;height:500px;border:none;border-radius:10px}
  #close{position:absolute;top:20px;right:30px;font-size:30px;cursor:pointer}
  @media(max-width:600px){input{width:150px}.hero h1{font-size:28px}#player iframe{height:250px}}
</style>
</head>
<body>

<header>
  <div class="logo">VUNO<span>ROYAL</span> MOVIES</div>
  <input id="search" placeholder="Search movies..." onkeyup="searchMovies()">
</header>

<div class="hero">
  <div>
    <h1>Watch Movies FREE</h1>
    <p>No Sign Up. No Payment. Just Press Play.</p>
    <button class="btn" onclick="playMovie('Night of the Living Dead','https://archive.org/embed/night_of_the_living_dead')">▶ WATCH NOW</button>
  </div>
</div>

<div class="row">
  <h2>🔥 Trending Free Movies</h2>
  <div class="grid" id="movieGrid"></div>
</div>

<div id="player">
  <div id="close" onclick="closePlayer()">✕</div>
  <h2 id="playerTitle" style="margin-bottom:15px;text-align:center"></h2>
  <iframe id="videoFrame" allowfullscreen></iframe>
  <p style="margin-top:15px;color:#aaa;font-size:13px">All movies are Public Domain / Legal - from Internet Archive & YouTube</p>
</div>

<script>
const movies = [
  {title:"Night of the Living Dead (1968)", genre:"Horror • Classic", img:"https://images.unsplash.com/photo-1509557965875-b88c97052f0e?w=400", url:"https://archive.org/embed/night_of_the_living_dead"},
  {title:"Charlie Chaplin - The Kid (1921)", genre:"Comedy • Classic", img:"https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400", url:"https://archive.org/embed/CC_1914_02_02_TheKid"},
  {title:"Sita Sings The Blues (2008)", genre:"Animation • Free", img:"https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400", url:"https://archive.org/embed/SitaSingsTheBlues"},
  {title:"Big Buck Bunny (2008)", genre:"Animation • Family", img:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400", url:"https://archive.org/embed/BigBuckBunny_124"},
  {title:"The General (1926)", genre:"Action • Classic", img:"https://images.unsplash.com/photo-1478720568477-152d9b164e26?w=400", url:"https://archive.org/embed/TheGeneral1926"},
  {title:"Nosferatu (1922)", genre:"Horror • Classic", img:"https://images.unsplash.com/photo-1509347528160-9a9e33742cdb?w=400", url:"https://archive.org/embed/Nosferatu_1922"},
  {title:"Metropolis (1927)", genre:"Sci-Fi • Classic", img:"https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?w=400", url:"https://archive.org/embed/Metropolis1927"},
  {title:"Plan 9 From Outer Space (1957)", genre:"Sci-Fi • Cult", img:"https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=400", url:"https://archive.org/embed/Plan9FromOuterSpace"},
];

function render(list){
  document.getElementById('movieGrid').innerHTML = list.map(m => `
    <div class="card" onclick="playMovie('${m.title}','${m.url}')">
      <img src="${m.img}">
      <div><h3>${m.title}</h3><p>${m.genre}</p><p style="color:#E50914">▶ Watch Free</p></div>
    </div>
  `).join('');
}
function searchMovies(){
  let q = document.getElementById('search').value.toLowerCase();
  render(movies.filter(m => m.title.toLowerCase().includes(q)));
}
function playMovie(title,url){
  document.getElementById('playerTitle').innerText = title;
  document.getElementById('videoFrame').src = url;
  document.getElementById('player').style.display = 'flex';
  window.scrollTo(0,0);
}
function closePlayer(){
  document.getElementById('videoFrame').src = '';
  document.getElementById('player').style.display = 'none';
}
render(movies);
</script>
</body>
</html>
