<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VUNO ROYAL 👑 Phonebook</title>
<script src="https://js.yoco.com/sdk/v1/yoco-sdk-web.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui,Arial}
body{background:#0a0a0a;color:#fff;margin:0;padding:0 14px 80px}
header{background:#111;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-size:19px;font-weight:900;color:#FFD700}
.card{background:#181818;border-radius:16px;padding:16px;margin:12px 0;border:1px solid #2a2a2a}
input,textarea,select{width:100%;background:#222;color:#fff;border:1px solid #333;border-radius:10px;padding:12px;margin:6px 0;font-size:15px}
label{font-size:12px;color:#aaa}
.btn{background:#FFD700;color:#000;border:0;padding:14px;border-radius:12px;font-weight:800;width:100%;font-size:16px;cursor:pointer;margin-top:8px}
.btn2{background:#25D366;color:#000;border:0;padding:12px;border-radius:12px;font-weight:700;width:100%;cursor:pointer;margin-top:8px}
.btnGhost{background:#222;color:#fff;border:1px solid #444;padding:10px;border-radius:10px;width:100%;cursor:pointer;margin-top:6px}
.btnSmall{background:#222;color:#fff;border:1px solid #444;padding:7px 10px;border-radius:20px;cursor:pointer;font-size:13px}
.btnView{background:#FFD700!important;color:#000!important;font-weight:800!important}
.pill{display:inline-block;background:#222;padding:4px 10px;border-radius:20px;font-size:12px;margin:2px}
.contact{background:#111;border-radius:14px;padding:14px;margin:10px 0;border-left:4px solid #FFD700;cursor:pointer}
.contact h3{margin:0 0 4px}
.small{font-size:13px;color:#aaa}
.searchBox{background:#222;border:2px solid #FFD700;border-radius:14px;padding:14px;font-size:16px}
.priceBox{background:linear-gradient(135deg,#FFD700,#FF8A00);color:#000;border-radius:14px;padding:16px;text-align:center;font-weight:800}
.lockBox{background:#3a1a1a;border:2px solid #ff5555;border-radius:14px;padding:18px;text-align:center}
.avatar{width:58px;height:58px;border-radius:50%;background:#FFD700;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;float:left;margin-right:12px;border:2px solid #FFD700}
.avatarImg{width:58px;height:58px;border-radius:50%;object-fit:cover;float:left;margin-right:12px;border:2px solid #FFD700}
.noteBox{background:#1a1a00;border:1px solid #333;border-radius:10px;padding:10px;margin-top:8px;font-size:14px}
.photoRow{display:flex;align-items:center;gap:12px;margin:8px 0}
.photoPreview{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid #FFD700;background:#222;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;flex-shrink:0}
.photoBtns{flex:1;display:flex;flex-direction:column;gap:6px}
.photoBtn{background:#222;color:#fff;border:1px solid #FFD700;padding:10px;border-radius:10px;cursor:pointer;font-size:14px;text-align:center}
.photoBtnRemove{background:transparent;color:#ff7777;border:1px solid #444;padding:8px;border-radius:10px;cursor:pointer;font-size:13px}
.customRow{display:flex;gap:8px;margin:6px 0;align-items:center}
.customRow input{margin:0}
.customRemove{background:#3a1a1a;color:#ff7777;border:1px solid #444;width:38px;height:42px;border-radius:10px;cursor:pointer;font-size:16px;flex-shrink:0}
.addFieldBtn{background:#1e2a1e;color:#7dff7d;border:1px dashed #7dff7d;padding:11px;border-radius:10px;width:100%;cursor:pointer;font-size:14px;margin-top:6px}
.addFieldBtn:disabled{background:#222;color:#777;border-color:#444;cursor:not-allowed}
.customBadge{display:inline-block;background:#1e2a1e;border:1px solid #2a5a2a;color:#aaffaa;padding:5px 10px;border-radius:8px;font-size:13px;margin:3px 3px 0 0}
.customBadge b{color:#fff}
.suggestRow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.suggestRow button{background:#222;color:#FFD700;border:1px solid #333;padding:6px 10px;border-radius:20px;cursor:pointer;font-size:12px}
.voucherBox{background:#111;border:2px solid #FFD700;border-radius:14px;padding:16px;text-align:center}
.voucherInput{background:#000;border:2px solid #FFD700!important;text-align:center;font-size:20px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.timerBox{background:#222;border-radius:10px;padding:10px;text-align:center;font-size:14px}
.countdown{font-size:26px;font-weight:900;color:#FFD700}
.subBadge{display:inline-block;background:#1e3a1e;color:#7dff7d;padding:4px 10px;border-radius:20px;font-size:12px}
#pinScreen{position:fixed;inset:0;background:#0a0a0a;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.pinInput{background:#111!important;border:2px solid #FFD700!important;text-align:center;font-size:32px!important;letter-spacing:12px!important;font-weight:900!important;width:180px!important;padding:16px!important;border-radius:16px!important}
.pinDots{font-size:36px;letter-spacing:12px;margin:12px 0}
.packageCard{border:2px solid #333;border-radius:14px;padding:14px;margin:8px 0;cursor:pointer}
.packageCard.sel{border-color:#FFD700;background:#1a1a00}
.packageCard.best{border-color:#25D366;background:#0a1a0a}
/* NEW - VIEW CONTACT MODAL */
#viewModal{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:998;display:none;overflow-y:auto;padding:16px}
.viewCard{background:#181818;border:1px solid #FFD700;border-radius:18px;padding:18px;max-width:520px;margin:20px auto}
.viewPhoto{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #FFD700;display:block;margin:0 auto 10px;background:#222}
.viewPhotoLetter{width:120px;height:120px;border-radius:50%;background:#FFD700;color:#000;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900;margin:0 auto 10px;border:3px solid #FFD700}
.viewRow{background:#111;border-radius:12px;padding:12px;margin:8px 0}
.viewRow b
